# Production stack for the storefront, served through the host's shared proxy. Run from this
# directory: `docker compose up -d`. Secrets come from ./storefront.env, never committed.
name: storefront

services:
  # One-shot: apply pending migrations before the app starts. Uses the builder stage, which the
  # slim runtime image does not carry.
  migrate:
    build:
      context: ../web
      target: builder
    command: sh -c "npx prisma migrate deploy"
    env_file: [./storefront.env]
    restart: "no"

  app:
    build:
      context: ../web
    env_file: [./storefront.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  storefront-db:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: storefront
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront"]
      interval: 10s
    restart: unless-stopped

volumes:
  db_data:
